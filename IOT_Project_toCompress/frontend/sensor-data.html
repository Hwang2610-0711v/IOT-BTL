<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor Data - IOT PTIT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div>
        <div class="brand-container">
          <div class="brand-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <span class="brand-title">IOT PTIT</span>
        </div>

        <nav class="nav-list">
          <a href="dashboard.html" class="nav-link">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            <span>Dashboard</span>
          </a>

          <a href="sensor-data.html" class="nav-link active">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Sensor Data</span>
          </a>

          <a href="history.html" class="nav-link">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>History</span>
          </a>

          <a href="profile.html" class="nav-link">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span>Profile</span>
          </a>
        </nav>
      </div>

      <!-- Khối nút Đăng xuất -->
      <div class="logout-box">
        <a href="index.html" class="logout-link">
          <svg style="width: 20px; height: 20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Đăng xuất</span>
        </a>
      </div>
    </aside>

    <main class="main-viewport">
      <div class="page-header header-icon-title">
        <div class="header-icon-box">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <h2>Dữ liệu cảm biến</h2>
      </div>

      <div class="content-table-card">
        <!-- Khối Bộ Lọc: Dropdown Lọc, Ô tìm kiếm và Nút Tìm kiếm hình kính lúp -->
        <div style="display: flex; gap: 16px; align-items: center;">
          <div class="filter-select-wrapper" style="width: 280px; flex-shrink: 0;">
            <select id="sensorFilterMain" class="filter-select">
              <option value="ALL" hidden selected>Lọc...</option>
              <option value="ALL">Tất cả</option>
              <option value="Nhiệt độ (DHT11)">Nhiệt độ (DHT11)</option>
              <option value="Độ ẩm (DHT11)">Độ ẩm (DHT11)</option>
              <option value="Độ sáng (CBAS)">CBAS</option>
              <option value="TIME">Thời gian</option>
            </select>
            <div class="select-arrow">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          <!-- Ô tìm kiếm -->
          <div id="dynamicSearchWrapper" style="width: 340px;">
            <input type="text" id="sensorDynamicInput" onkeydown="if(event.key==='Enter') handleSensorSearch()" placeholder="Nhập để tìm kiếm..." class="filter-input">
          </div>

          <!-- Nút Tìm kiếm hình kính lúp -->
          <button type="button" onclick="handleSensorSearch()" class="btn-search" title="Tìm kiếm">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>

        <!-- Bảng Dữ Liệu -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>CẢM BIẾN</th>
                <th>GIÁ TRỊ ĐO</th>
                <th>THỜI GIAN</th>
              </tr>
            </thead>
            <tbody id="sensorTableBody">
              <!-- Render tự động từ renderSensorDataTable() ở main.js -->
            </tbody>
          </table>
        </div>

        <!-- Thanh Phân Trang Động -->
        <div class="pagination-container">
          <div class="pagination-info">
            <span>Hiển thị</span>
            <select id="sensorPageSize" onchange="changeSensorPageSize()" class="pagination-select">
              <option value="8">8</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
            </select>
            <span>trong tổng số <strong id="sensorTotalRecords" style="color: #0f172a;">250</strong> bản ghi</span>
          </div>

          <div class="pagination-buttons" id="sensorPaginationButtons">
            <!-- Nút phân trang render từ main.js -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
