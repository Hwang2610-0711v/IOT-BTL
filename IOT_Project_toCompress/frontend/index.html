<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOT PTIT - Đăng Nhập</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Notification Toast -->
  <div id="toastContainer"></div>

  <div class="login-screen">
    <!-- Cột Trái: Banner Xanh PTIT (#1746c9) -->
    <div class="login-left-banner">
      <div class="bg-glow-1"></div>
      <div class="bg-glow-2"></div>

      <div style="position: relative; z-index: 10;">
        <h1 class="brand-title" style="font-size: 24px;">IOT PTIT</h1>
      </div>

      <!-- Đồ Họa Node IoT Trung Tâm -->
      <div style="position: relative; z-index: 10; margin: auto; padding: 24px 0;">
        <div class="node-container">
          <div class="central-gateway">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
            </svg>
            <div class="radio-dot"></div>
          </div>

          <div class="node-item node-left">
            <span class="node-tag">TEMP</span>
            <span class="node-val">28°C</span>
          </div>
          <div class="line-horizontal-left"></div>

          <div class="node-item node-right">
            <span class="node-tag">HUM</span>
            <span class="node-val">65%</span>
          </div>
          <div class="line-horizontal-right"></div>

          <div class="node-item node-bottom">
            <span class="node-tag">LIGHT</span>
            <span class="node-val">480lx</span>
          </div>
          <div class="line-vertical-bottom"></div>
        </div>

        <p class="login-slogan">
          Giám sát và điều khiển<br>thiết bị thông minh
        </p>
      </div>

      <div style="position: relative; z-index: 10; font-size: 12px; color: rgba(255, 255, 255, 0.7);">
        © 2026 IOT PTIT le_the_hoang
      </div>
    </div>

    <!-- Cột Phải: Form Đăng Nhập -->
    <div class="login-right-form">
      <div class="login-box">
        
        <!-- KHỐI 1: FORM ĐĂNG NHẬP -->
        <div id="loginFormContainer">
          <h2>Đăng nhập</h2>
          <p class="subtitle">Chào mừng bạn quay lại hệ thống IOT PTIT</p>

          <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
              <label>Email hoặc tên đăng nhập</label>
              <div class="input-with-icon">
                <div class="input-icon-left">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <input type="text" id="loginUsername" class="form-input" required value="admin@iotptit.vn" placeholder="admin@iotptit.vn">
              </div>
            </div>

            <div class="form-group">
              <label>Mật khẩu</label>
              <div class="input-with-icon">
                <div class="input-icon-left">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input type="password" id="loginPassword" class="form-input" style="padding-right: 44px;" required value="12345678" placeholder="••••••••">
                <button type="button" onclick="togglePasswordVisibility()" class="input-icon-right">
                  <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-extra">
              <label class="remember-label">
                <input type="checkbox" checked>
                <span>Ghi nhớ đăng nhập</span>
              </label>
              <a href="javascript:void(0)" onclick="showToast('Chức năng khôi phục mật khẩu đã được gửi đến email admin!', 'info')" class="forgot-link">
                Quên mật khẩu?
              </a>
            </div>

            <button type="submit" class="btn-primary-blue">Đăng nhập</button>

            <div class="register-hint">
              Chưa có tài khoản? <a href="javascript:void(0)" onclick="toggleAuthMode()">Đăng ký ngay</a>
            </div>
          </form>
        </div>

        <!-- KHỐI 2: FORM ĐĂNG KÝ (Mặc định ẩn) -->
        <div id="registerFormContainer" style="display: none;">
          <h2>Đăng ký</h2>
          <p class="subtitle">Tạo tài khoản mới để sử dụng hệ thống</p>

          <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
            <!-- Ô nhập Họ và Tên -->
            <div class="form-group">
              <label>Họ và tên</label>
              <div class="input-with-icon">
                <div class="input-icon-left">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                </div>
                <input type="text" id="registerFullName" class="form-input" placeholder="Nguyễn Văn A">
              </div>
            </div>

            <!-- Ô nhập Tên đăng nhập -->
            <div class="form-group">
              <label>Tên đăng nhập</label>
              <div class="input-with-icon">
                <div class="input-icon-left">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <input type="text" id="registerUsername" class="form-input" required placeholder="Nhập tên đăng nhập">
              </div>
            </div>

            <!-- Ô nhập Mật khẩu -->
            <div class="form-group">
              <label>Mật khẩu</label>
              <div class="input-with-icon">
                <div class="input-icon-left">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input type="password" id="registerPassword" class="form-input" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" class="btn-primary-blue" style="margin-top: 16px;">Đăng ký</button>

            <div class="register-hint">
              Đã có tài khoản? <a href="javascript:void(0)" onclick="toggleAuthMode()">Đăng nhập</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Nạp Tầng Dữ liệu và Tầng Điều khiển -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
